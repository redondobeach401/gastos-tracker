name: auditoria
on:
  schedule:
    - cron: "0 6 * * 1"      # lunes a las 06:00 UTC: salen CVE nuevas aunque no haya cambios en el repo
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: auditoria
  cancel-in-progress: false
jobs:
  auditoria:
    runs-on: ubuntu-latest   # sin environment ni secrets: solo publica un issue si algo falla
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write          # solo para avisar (scripts/notify.sh)
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-audit.txt
      - run: pip install --require-hashes -r requirements-audit.txt
      - run: pip-audit --require-hashes -r requirements-dev.txt
      - name: Avisar de la vulnerabilidad
        if: failure()
        run: |
          printf '## pip-audit ha encontrado dependencias vulnerables\n\n[Ver la ejecución](%s/%s/actions/runs/%s)\n' \
            "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" > failure.md
          bash scripts/notify.sh open "enable-banking: dependencias vulnerables" failure.md
      - name: Cerrar aviso resuelto
        if: success()
        run: |
          bash scripts/notify.sh close "enable-banking: dependencias vulnerables"
